<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Novo Filme - FilmoTokio</title>
</head>
<body>
<h1>Novo Filme</h1>
<form th:action="@{/new-film}" th:object="${film}" method="post">
    <label>Título: <input type="text" th:field="*{title}"/></label><br/>
    <label>Ano: <input type="number" th:field="*{year}"/></label><br/>
    <label>Duração (min): <input type="number" th:field="*{duration}"/></label><br/>
    <label>Sinopse: <textarea th:field="*{sypnosis}"></textarea></label><br/>
    <label>Poster (URL): <input type="text" th:field="*{poster}"/></label><br/>

    <label>Realizador:
        <select name="directorId">
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.name} + ' ' + ${p.surname} + ' (' + ${p.type} + ')'"></option>
        </select>
    </label><br/>

    <label>Fotógrafo:
        <select name="photographerId">
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.name} + ' ' + ${p.surname} + ' (' + ${p.type} + ')'"></option>
        </select>
    </label><br/>

    <label>Atores (Cmd+clique para vários):
        <select name="actorIds" multiple="multiple">
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.name} + ' ' + ${p.surname} + ' (' + ${p.type} + ')'"></option>
        </select>
    </label><br/>

    <label>Músicos:
        <select name="musicianIds" multiple="multiple">
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.name} + ' ' + ${p.surname} + ' (' + ${p.type} + ')'"></option>
        </select>
    </label><br/>

    <label>Argumentistas:
        <select name="screenwriterIds" multiple="multiple">
            <option th:each="p : ${pessoas}" th:value="${p.id}" th:text="${p.name} + ' ' + ${p.surname} + ' (' + ${p.type} + ')'"></option>
        </select>
    </label><br/>

    <button type="submit">Guardar</button>
</form>
<a th:href="@{/}">Voltar</a>
</body>
</html>
